<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Teacher Hub 🩵</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastel: {
              primary: '#78B8E8',
              soft: '#EAF5FF',
              sky: '#B8DDF8',
              navy: '#263B59',
              bg: '#F7FAFE',
              lavender: '#E8E4FF',
              pink: '#FFE5ED',
              yellow: '#FFF1C9',
              green: '#DDF5E8',
            }
          },
          fontFamily: {
            sans: ['Nunito', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-pastel-bg font-sans text-pastel-navy min-h-screen flex flex-col md:flex-row antialiased">

  <!-- APP STATE / UI HOLDER -->
  <div id="app" class="flex w-full min-h-screen">
    
    <!-- MOBILE HEADER / HAMBURGER -->
    <div class="md:hidden fixed top-0 left-0 right-0 bg-white border-b border-pastel-soft p-4 flex justify-between items-center z-30">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐻</span>
        <span class="font-bold text-pastel-navy">Little Teacher Hub</span>
      </div>
      <button id="mobile-menu-btn" class="p-2 rounded-xl bg-pastel-soft text-pastel-navy">
        <i data-lucide="menu"></i>
      </button>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-pastel-soft transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out overflow-y-auto">
      <div class="p-6 border-b border-pastel-soft flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-pastel-soft flex items-center justify-center text-xl shadow-sm">
            🐻
          </div>
          <div>
            <h1 class="font-bold text-base leading-tight">Little Teacher</h1>
            <span class="text-xs text-slate-400 font-medium">Dashboard Hub</span>
          </div>
        </div>
        <button id="close-sidebar-btn" class="md:hidden text-slate-400">
          <i data-lucide="x"></i>
        </button>
      </div>

      <nav class="p-4 space-y-6">
        <div>
          <p class="text-[11px] font-bold text-slate-400 tracking-wider mb-2 px-3">GENERAL</p>
          <div class="space-y-1">
            <a href="#dashboard" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm bg-pastel-soft text-pastel-primary shadow-sm">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
            </a>
            <a href="#schedule" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-50">
              <i data-lucide="calendar" class="w-4 h-4"></i> Jadwal Mengajar
            </a>
            <a href="#tasks" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-50">
              <i data-lucide="check-square" class="w-4 h-4"></i> Task Manager
            </a>
            <a href="#notes" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-50">
              <i data-lucide="sticky-note" class="w-4 h-4"></i> Quick Notes
            </a>
          </div>
        </div>

        <div>
          <p class="text-[11px] font-bold text-slate-400 tracking-wider mb-2 px-3">TEACHING TOOLS</p>
          <div class="space-y-1">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:bg-slate-50">
              <i data-lucide="book-open" class="w-4 h-4"></i> Teaching Planner
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl font-bold text-sm text-slate-400 hover:bg-slate-50">
              <i data-lucide="folder-kanban" class="w-4 h-4"></i> Bank Materi
            </a>
          </div>
        </div>
      </nav>
    </aside>

    <!-- BACKDROP MOBILE -->
    <div id="backdrop" class="fixed inset-0 bg-slate-900/20 z-30 hidden md:hidden"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 md:p-8 pt-20 md:pt-8 overflow-y-auto">
      
      <!-- TOPBAR -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
          <h2 class="text-2xl font-bold text-pastel-navy">Halo, Ibu Guru! 🩵</h2>
          <p id="current-date" class="text-sm text-slate-400 font-semibold">Memuat tanggal...</p>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
          <div class="bg-white border border-pastel-soft px-4 py-2 rounded-2xl flex items-center gap-2 shadow-sm w-full md:w-64">
            <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
            <input type="text" placeholder="Cari jadwal, tugas..." class="bg-transparent border-none text-sm outline-none w-full">
          </div>
          <div class="w-10 h-10 rounded-2xl bg-pastel-soft border border-pastel-sky flex items-center justify-center font-bold text-pastel-primary shadow-sm">
            👩‍🏫
          </div>
        </div>
      </div>

      <!-- DASHBOARD WIDGETS -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- TODAY'S SCHEDULE -->
        <div class="md:col-span-2 bg-white rounded-3xl p-6 border border-pastel-soft shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="text-xl">📚</span>
              <h3 class="font-bold text-lg text-pastel-navy">Jadwal Mengajar Hari Ini</h3>
            </div>
            <span id="day-badge" class="bg-pastel-soft text-pastel-primary px-3 py-1 rounded-full text-xs font-bold">Hari Ini</span>
          </div>

          <div id="today-schedule-list" class="space-y-3">
            <div class="text-center py-8 text-slate-400 text-sm">Menyinkronkan data dari Firebase...</div>
          </div>
        </div>

        <!-- QUICK TASKS WIDGET -->
        <div class="bg-white rounded-3xl p-6 border border-pastel-soft shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="text-xl">✨</span>
              <h3 class="font-bold text-lg text-pastel-navy">Tugas Hari Ini</h3>
            </div>
          </div>

          <form id="add-task-form" class="flex gap-2">
            <input id="task-input" type="text" placeholder="Tambah tugas baru..." class="flex-1 border border-pastel-soft rounded-xl px-3 py-2 text-sm outline-none focus:border-pastel-primary">
            <button type="submit" class="bg-pastel-primary text-white p-2 rounded-xl">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </form>

          <div id="tasks-list" class="space-y-2">
            <!-- Dynamic task items -->
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- FIREBASE CONFIG & INITIALIZATION (Modular SDK v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Konfigurasi Firebase milikmu
    const firebaseConfig = {
      apiKey: "AIzaSyCQGMbFxIH1Y1LCLVM1Qwb_JREYeX2U_ds",
      authDomain: "teachberry.firebaseapp.com",
      projectId: "teachberry",
      storageBucket: "teachberry.firebasestorage.app",
      messagingSenderId: "27935164603",
      appId: "1:27935164603:web:2a381464d037693d8e819e"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ID pengguna default (dapat diganti dengan Auth sesungguhnya)
    const USER_ID = "default_teacher";

    // Data Jadwal Awal (SD Islam Makarima)
    const INITIAL_SCHEDULE = [
      { day: "Senin", timeSlot: "07.00–07.35", activity: "Ikrar, Dhuha, Dzikir Pagi", category: "ibadah" },
      { day: "Senin", timeSlot: "07.35–08.35", activity: "Tahfidz", category: "tahfidz" },
      { day: "Senin", timeSlot: "08.35–09.10", activity: "4B", category: "kelas" },
      { day: "Senin", timeSlot: "09.10–09.45", activity: "4B", category: "kelas" },
      { day: "Senin", timeSlot: "09.45–10.20", activity: "Perpus (5)", category: "perpus" },
      { day: "Senin", timeSlot: "10.20–10.35", activity: "Istirahat 1", category: "istirahat" },
      { day: "Senin", timeSlot: "10.35–11.10", activity: "5", category: "kelas" },
      { day: "Senin", timeSlot: "11.10–11.45", activity: "5 & Perpus (2B)", category: "perpus" },
      { day: "Senin", timeSlot: "11.45–12.25", activity: "Ishoma", category: "istirahat" },
      { day: "Senin", timeSlot: "12.25–13.00", activity: "6", category: "kelas" },
      { day: "Senin", timeSlot: "13.00–13.35", activity: "6", category: "kelas" },
      { day: "Senin", timeSlot: "13.35–14.00", activity: "Perpus (3C)", category: "perpus" },
      { day: "Senin", timeSlot: "14.00–14.30", activity: "Murojaah", category: "ibadah" },
      // Selasa
      { day: "Selasa", timeSlot: "07.00–07.35", activity: "Ikrar, Dhuha, Dzikir Pagi", category: "ibadah" },
      { day: "Selasa", timeSlot: "07.35–08.35", activity: "Tahfidz", category: "tahfidz" },
      { day: "Selasa", timeSlot: "08.35–09.10", activity: "4A & Perpus (2A)", category: "perpus" },
      { day: "Selasa", timeSlot: "09.10–09.45", activity: "4A", category: "kelas" },
      { day: "Selasa", timeSlot: "09.45–10.20", activity: "Perpus (4A)", category: "perpus" },
      { day: "Selasa", timeSlot: "10.20–10.35", activity: "Istirahat 1", category: "istirahat" },
      { day: "Selasa", timeSlot: "10.35–11.10", activity: "5", category: "kelas" },
      { day: "Selasa", timeSlot: "11.10–11.45", activity: "5 & Perpus (1A)", category: "perpus" },
      { day: "Selasa", timeSlot: "11.45–12.25", activity: "Ishoma", category: "istirahat" },
      { day: "Selasa", timeSlot: "12.25–13.00", activity: "6", category: "kelas" },
      { day: "Selasa", timeSlot: "13.00–13.35", activity: "6 & Perpus (2C)", category: "perpus" },
      { day: "Selasa", timeSlot: "13.35–14.00", activity: "6", category: "kelas" },
      { day: "Selasa", timeSlot: "14.00–14.30", activity: "Murojaah", category: "ibadah" }
    ];

    // Helper Kategori Warna Pastel
    const getBadgeStyle = (cat) => {
      switch(cat) {
        case 'ibadah': return 'bg-pastel-yellow text-amber-800';
        case 'tahfidz': return 'bg-pastel-lavender text-purple-900';
        case 'kelas': return 'bg-pastel-soft text-pastel-navy font-bold';
        case 'perpus': return 'bg-pastel-pink text-pink-900';
        case 'istirahat': return 'bg-slate-100 text-slate-500';
        default: return 'bg-pastel-soft text-pastel-navy';
      }
    };

    // Formatter Tanggal
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const today = new Date();
    document.getElementById('current-date').textContent = today.toLocaleDateString('id-ID', options);

    const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const currentDayName = dayNames[today.getDay()];
    document.getElementById('day-badge').textContent = currentDayName;

    // SINKRONISASI REAL-TIME JADWAL (FIRESTORE)
    const scheduleColRef = collection(db, "users", USER_ID, "schedule");

    onSnapshot(scheduleColRef, (snapshot) => {
      if (snapshot.empty) {
        // Jika database masih kosong, isi dengan data awal
        INITIAL_SCHEDULE.forEach(item => {
          addDoc(scheduleColRef, { ...item, createdAt: serverTimestamp() });
        });
      } else {
        const scheduleData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTodaySchedule(scheduleData, currentDayName);
      }
    });

    function renderTodaySchedule(schedules, dayName) {
      const container = document.getElementById('today-schedule-list');
      const filtered = schedules.filter(s => s.day === (dayName === 'Minggu' || dayName === 'Sabtu' ? 'Senin' : dayName));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">Tidak ada jadwal mengajar hari ini. ✨</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="flex items-center justify-between p-3.5 rounded-2xl ${getBadgeStyle(item.category)} shadow-sm transition">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold px-2.5 py-1 bg-white/70 rounded-lg">${item.timeSlot}</span>
            <span class="font-bold text-sm">${item.activity}</span>
          </div>
          <span class="text-xs font-semibold opacity-75 capitalize">${item.category}</span>
        </div>
      `).join('');
    }

    // SINKRONISASI REAL-TIME TASK MANAGER (FIRESTORE)
    const tasksColRef = collection(db, "users", USER_ID, "tasks");

    document.getElementById('add-task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) return;

      await addDoc(tasksColRef, {
        title: title,
        completed: false,
        createdAt: serverTimestamp()
      });
      input.value = '';
    });

    onSnapshot(tasksColRef, (snapshot) => {
      const tasksList = document.getElementById('tasks-list');
      if (snapshot.empty) {
        tasksList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada tugas. Yuk tambah! ✨</p>`;
        return;
      }

      tasksList.innerHTML = snapshot.docs.map(docSnap => {
        const task = docSnap.data();
        const taskId = docSnap.id;
        return `
          <div class="flex items-center justify-between p-3 rounded-xl bg-pastel-bg border border-pastel-soft">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${task.completed ? 'checked' : ''} 
                onchange="window.toggleTask('${taskId}', ${!task.completed})"
                class="rounded text-pastel-primary focus:ring-0">
              <span class="text-xs font-semibold ${task.completed ? 'line-through text-slate-400' : 'text-pastel-navy'}">${task.title}</span>
            </div>
            <button onclick="window.deleteTask('${taskId}')" class="text-slate-300 hover:text-rose-400">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');
      
      lucide.createIcons();
    });

    // Event Handler Global untuk Toggle & Delete Task
    window.toggleTask = async (id, status) => {
      await updateDoc(doc(db, "users", USER_ID, "tasks", id), { completed: status });
    };

    window.deleteTask = async (id) => {
      await deleteDoc(doc(db, "users", USER_ID, "tasks", id));
    };

    // MOBILE SIDEBAR TOGGLE
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');

    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    });

    const closeSidebar = () => {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    };

    document.getElementById('close-sidebar-btn').addEventListener('click', closeSidebar);
    backdrop.addEventListener('click', closeSidebar);

    // Render Lucide Icons saat pertama muat
    lucide.createIcons();
  </script>
</body>
</html>
